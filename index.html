#gcur .t::after{content:" ♥";color:var(--P)}

@keyframes dt{0%,60%{opacity:1}30%{opacity:.2}}

    background:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px) 0 0/24px 24px,var(--c, #E3DCF6)}

@keyframes blIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bxIn{from{opacity:0}to{opacity:1}}
